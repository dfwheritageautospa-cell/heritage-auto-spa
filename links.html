<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Auto Spa | Links</title>
<meta name="description" content="Heritage Auto Spa — premium mobile detailing & ceramic coating in DFW. Book, call, review, and follow.">
<style>
  :root { --red:#c8102e; --red-hi:#e8213f; --bg:#0b0b0c; --card:#151517; --line:#2a2a2e; --txt:#f4f4f5; --muted:#a1a1aa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);
    background:radial-gradient(ellipse at top, #3a0710 0%, var(--bg) 55%) fixed;
    display:flex; justify-content:center; padding:48px 18px 40px;
  }
  .wrap { width:100%; max-width:480px; text-align:center; }
  .logo {
    width:150px; height:150px; margin:0 auto 18px; border-radius:50%;
    background:#000 center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:800; letter-spacing:1px; color:var(--red);
    box-shadow:0 0 30px rgba(200,16,46,.45);
  }
  h1 { font-size:28px; font-weight:800; letter-spacing:.5px; }
  .tag { margin-top:6px; color:var(--muted); font-size:15px; line-height:1.4; }
  .slogan { margin-top:10px; font-style:italic; color:var(--red-hi); font-size:14px; }
  .links { margin-top:30px; display:flex; flex-direction:column; gap:14px; }
  a.btn {
    display:flex; align-items:center; gap:14px; padding:17px 20px; border-radius:14px;
    background:var(--card); border:1px solid var(--line); color:var(--txt);
    text-decoration:none; font-weight:700; font-size:16px;
    transition:transform .12s, border-color .12s, background .12s;
  }
  a.btn:hover, a.btn:active { transform:translateY(-2px); border-color:var(--red); }
  a.btn.primary { background:var(--red); border-color:var(--red); }
  a.btn.primary:hover { background:var(--red-hi); }
  a.btn span.label { flex:1; text-align:center; margin-right:28px; }
  .ico { width:28px; height:28px; flex:none; display:flex; align-items:center; justify-content:center; }
  .ico svg { width:24px; height:24px; fill:currentColor; }
  .socials { margin-top:30px; display:flex; justify-content:center; gap:22px; }
  .socials a { color:var(--txt); opacity:.85; }
  .socials a:hover { color:var(--red-hi); opacity:1; }
  .socials svg { width:30px; height:30px; fill:currentColor; }
  footer { margin-top:34px; color:var(--muted); font-size:12px; }
</style>
</head>
